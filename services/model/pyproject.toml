[project]
name = "hydrocycle-model"
version = "0.1.0"
description = "Evidence-gated hydrogen-water engine simulation service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Donald Filimon" }]
dependencies = [
  "alembic>=1.16,<2",
  "cantera==3.2.0",
  "fastapi>=0.116,<1",
  "numpy>=2.3,<3",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.16,<2",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
hydrocycle-model = "hydrocycle.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrocycle"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "cantera: tests that exercise Cantera thermodynamic behavior",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "ISC", "PIE", "PT", "PTH", "RET", "RUF", "SIM", "T20"]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999"]
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
packages = ["hydrocycle"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cantera", "cantera.*", "scipy", "scipy.*"]
ignore_missing_imports = true
