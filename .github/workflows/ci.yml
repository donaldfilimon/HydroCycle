name: CI

# Trusted same-repo events (push to main, same-repo pull requests) run on the
# macOS arm64 self-hosted runner registered to this repository with the label
# hydrocycle. Fork pull requests run the unchanged *-hosted copies on
# GitHub-hosted runners only: never schedule untrusted code on the self-hosted
# machine. Until a runner with these labels is online, the self-hosted jobs
# wait in the queue. Runner setup and security: docs/SelfHostedRunner.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Full gate (bun run check)
    if: >
      github.repository == 'donaldfilimon/HydroCycle' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, hydrocycle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Check runner host prerequisites
        run: |
          # GitHub-hosted Ubuntu ships Node.js; Next.js 16, the mobile loopback
          # probe and the other package bins run under it. Install it on the
          # runner host (docs/SelfHostedRunner.md).
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js 20.9+ is not on the runner PATH. See docs/SelfHostedRunner.md."
            exit 1
          fi
          node --version
          node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 20 || (a === 20 && b >= 9) ? 0 : 1)' ||
            { echo "::error::Node.js 20.9+ is required on the runner PATH."; exit 1; }

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # actions/setup-python's macOS builds are non-relocatable and only work
      # from /Users/runner/hostedtoolcache, which a personal Mac does not have
      # without sudo. uv installs the same pinned minor version per user
      # (~/.local/share/uv/python) from services/model/.python-version, and
      # every Python entry point in this repo already goes through uv.
      - name: Set up Python (uv-managed, services/model/.python-version)
        working-directory: services/model
        run: |
          uv python install
          uv python find

      - name: Set up workspace
        run: bun run setup

      - name: Run full gate
        run: bun run check

  check-hosted:
    name: Full gate (bun run check) (GitHub-hosted, fork PRs)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: services/model/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up workspace
        run: bun run setup

      - name: Run full gate
        run: bun run check

  e2e:
    name: Playwright e2e
    needs: check
    if: >
      github.repository == 'donaldfilimon/HydroCycle' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, hydrocycle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Check runner host prerequisites
        run: |
          # GitHub-hosted Ubuntu ships Node.js; Next.js 16, the mobile loopback
          # probe and the other package bins run under it. Install it on the
          # runner host (docs/SelfHostedRunner.md).
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js 20.9+ is not on the runner PATH. See docs/SelfHostedRunner.md."
            exit 1
          fi
          node --version
          node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 20 || (a === 20 && b >= 9) ? 0 : 1)' ||
            { echo "::error::Node.js 20.9+ is required on the runner PATH."; exit 1; }
          # Playwright projects select channel "chrome"; GitHub-hosted Ubuntu
          # ships Google Chrome, so the runner host needs it too.
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "::error::Google Chrome is not installed in /Applications. See docs/SelfHostedRunner.md."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # actions/setup-python's macOS builds are non-relocatable and only work
      # from /Users/runner/hostedtoolcache, which a personal Mac does not have
      # without sudo. uv installs the same pinned minor version per user
      # (~/.local/share/uv/python) from services/model/.python-version, and
      # every Python entry point in this repo already goes through uv.
      - name: Set up Python (uv-managed, services/model/.python-version)
        working-directory: services/model
        run: |
          uv python install
          uv python find

      - name: Set up workspace
        run: bun run setup

      - name: Install Playwright browsers
        run: bun run test:e2e:install

      - name: Run e2e
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  e2e-hosted:
    name: Playwright e2e (GitHub-hosted, fork PRs)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    needs: check-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: services/model/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up workspace
        run: bun run setup

      - name: Install Playwright browsers
        run: bun run test:e2e:install

      - name: Run e2e
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
